name: Pantheon checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm.cmd ci
      - name: Lint correctness rules
        run: npm.cmd run lint
      - name: Audit runtime dependencies
        # The Agents SDK currently loads its MCP package despite declaring it
        # optional. Keep advisories visible and fail closed on critical issues
        # until a compatible upstream release removes the current transitive set.
        run: npm.cmd audit --omit=dev --audit-level=critical

  tests:
    name: tests (${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Use Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-renderer-lock.txt
      - name: Install locked dependencies
        run: npm.cmd ci
      - name: Bootstrap exact checkout-local renderer
        shell: powershell
        run: npm.cmd run renderer:bootstrap -- --python "$env:pythonLocation\python.exe" --recreate
      - name: Validate exact checkout-local renderer
        run: npm.cmd run renderer:check
      - name: Run isolated test shard
        shell: powershell
        env:
          PANTHEON_TEST_SHARD_COUNT: "5"
          PANTHEON_TEST_SHARD_INDEX: ${{ matrix.shard }}
        run: npm.cmd test

  windows-lifecycle:
    runs-on: windows-latest
    # The test wrapper remains the nine-minute hard bound. This outer envelope
    # leaves setup and accountable cleanup time without concealing a hung proof.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        phase: [containment, repeat]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm.cmd ci
      - name: Run quarantined Windows lifecycle proof
        shell: powershell
        env:
          PANTHEON_LIFECYCLE_CI: "1"
          PANTHEON_LIFECYCLE_PHASE: ${{ matrix.phase }}
        run: npm.cmd run test:lifecycle:ci
