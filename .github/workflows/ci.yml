name: Pantheon checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm.cmd ci
      - name: Lint correctness rules
        run: npm.cmd run lint
      - name: Audit runtime dependencies
        # The Agents SDK currently loads its MCP package despite declaring it
        # optional. Keep advisories visible and fail closed on critical issues
        # until a compatible upstream release removes the current transitive set.
        run: npm.cmd audit --omit=dev --audit-level=critical

  tests:
    name: tests (${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Use Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install locked dependencies
        run: npm.cmd ci
      - name: Install rendering dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-runtime.txt
      - name: Run isolated test shard
        shell: powershell
        env:
          PANTHEON_TEST_SHARD_COUNT: "4"
          PANTHEON_TEST_SHARD_INDEX: ${{ matrix.shard }}
        run: npm.cmd test

  windows-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm.cmd ci
      - name: Run quarantined Windows lifecycle proof
        shell: powershell
        env:
          PANTHEON_LIFECYCLE_CI: "1"
        run: npm.cmd run test:lifecycle:ci
