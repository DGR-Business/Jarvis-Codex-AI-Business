# Project-scoped Codex settings for this trusted local runtime.
# Keep secrets and OAuth tokens out of this file.

project_doc_max_bytes = 65536
project_doc_fallback_filenames = ["AGENTS.md"]

# Codex collaboration is shallow and bounded for this project. This is an
# engineering-thread ceiling, not the Jarvis business-worker roster, provider
# concurrency, or permission to start live work.
[features]
multi_agent = true

[agents]
max_threads = 11
max_depth = 1
interrupt_message = true

